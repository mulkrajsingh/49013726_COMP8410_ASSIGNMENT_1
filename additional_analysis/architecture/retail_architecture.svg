ight="normal" fill="#151515">PROPOSED approved answers / merchandising media / internal draft assets</text><text x="640" y="856.5" text-anchor="middle" font-family="Arial" font-size="24" font-weight="normal" fill="#151515">Reviewer rejects or returns a draft for correction before any customer publication</text><text x="30" y="910" font-family="Arial" font-size="21" fill="#333">SOLID: implemented inputs, adapters, outputs. DASHED: proposed interfaces and approval links.</text><text x="30" y="944" font-family="Arial" font-size="21" fill="#333">Shared experiment resources: ABO photos for P01–P03. P04 alone uses the fictional JSON catalogue.</text><text x="30" y="978" font-family="Arial" font-size="21" fill="#333">Proposed shared product IDs: verified specifications for P01/P04; approved photo/media records for P02/P03.</text><text x="30" y="1012" font-family="Arial" font-size="21" fill="#333">Production links and ABO-to-catalogue mapping are unimplemented. CPU scoring reads saved evidence.</text></svg>